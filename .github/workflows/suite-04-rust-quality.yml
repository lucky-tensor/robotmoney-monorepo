# Canonical: docs/development/ci-suites.md §4
#
# WHY THIS SUITE EXISTS
# clippy -D warnings is the project's primary defence against silent logic errors in Rust
# (unused results, incorrect lifetime annotations, integer overflow in debug mode). The
# doc-coverage gate exists because rmpc ships as a programmable library — undocumented
# pub types cause downstream agents to misuse the API. Both checks are cheap enough to
# run on every Rust change without slowing down PR feedback.
#
# WHY doc-coverage NEEDS lint FIRST
# cargo doc runs a full build internally. There is no point building twice (once for
# clippy, once for rustdoc) if the code has lint errors that will be fixed before merge.
# Gating saves roughly 2–3 minutes per failed push.
#
# WHY cargo build --all-targets BEFORE cargo doc
# cargo doc --no-deps will silently skip crates that fail to compile. The explicit build
# step surfaces compile errors with the full error message; without it, a broken crate
# just disappears from the rustdoc output and check_rustdoc_coverage.py reports false
# coverage (nothing to cover = 100%).
#
# WHY cargo audit RUNS IN ITS OWN JOB
# cargo audit fetches the advisory database from GitHub (rustsec/advisory-db). It does
# not need the Cargo build cache and its network fetch should not block the lint job
# from running in parallel. Running it as a separate job also means a new high-severity
# advisory added upstream mid-PR does not cause confusing fmt/clippy noise.
#
# GOTCHAS
# - The Cargo cache key hashes all four Cargo.toml files. Adding a new crate to the
#   workspace requires adding its Cargo.toml to the key, otherwise the cache will never
#   invalidate when that crate's dependencies change.
# - cargo clippy --all-targets includes integration tests and benchmarks. A warning in a
#   test helper file is still a hard failure. This is intentional: test code is real code.
# - check_rustdoc_coverage.py parses the rustdoc.log warning lines. If rustdoc changes
#   its warning format in a future Rust release, the script may silently under-count
#   missing docs and pass. Pin the Rust toolchain version if this is a concern.
# - cargo audit reads .cargo/audit.toml for deny/ignore configuration. To accept a
#   known low-risk advisory temporarily, add it to the [ignore] section in that file
#   with an expiry comment. Do not suppress advisories without a dated justification.

name: rust-fmt-clippy-doc-coverage

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: rust-lint
    runs-on: ubuntu-latest
    # 25 (was 20): the logging-facade guard added by issue #1282 is the first
    # `cargo test` in this job, so on a cold cache it codegens rmpc-logging and
    # its (small) dependency tree that clippy had only ever type-checked.
    # 35 (was 25): the embedded-migration parity guard added by issue #1416 is
    # an explorer-indexer test target, so on a cold cache it additionally
    # codegens that package's dev-dependency graph (testcontainers, bollard,
    # rmpc-fork-e2e) which clippy had only type-checked.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check (all crates)
        run: cargo fmt --check --all

      - name: cargo clippy (all crates, all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # WORKSPACE LOGGING-FACADE GUARD (issue #247, wired by issue #1282)
      # crates/rmpc-logging/tests/workspace_uses_shared_facade.rs walks every
      # binary and service entrypoint in the workspace and fails if one
      # initialises logging with `tracing_subscriber::fmt()` instead of
      # `rmpc_logging::init_service`. It is a source-text walk: no chain, no
      # Docker, no fixture, ~0s runtime. It was executed by NO workflow, so the
      # regression it exists to make load-bearing was not load-bearing at all.
      # It belongs in this suite because its subject is workspace-wide Rust
      # quality, which is what this suite is. Wrapped in the executed-count
      # guard so a zero-tests-collected run fails RED, never silent-green.
      - name: Workspace logging facade guard
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p rmpc-logging \
            --test workspace_uses_shared_facade -- --nocapture

      # EMBEDDED-MIGRATION PARITY GUARD (issue #1416)
      # services/explorer-indexer/src/db.rs embeds the migration set at COMPILE
      # time with `sqlx::migrate!("./migrations")`. On stable Rust that macro
      # registers no `rerun-if-changed` for the directory it read (sqlx calls
      # `proc_macro::tracked_path::path()` only under `sqlx_macros_unstable`),
      # so before #1416 a `.sql`-only change did not make cargo rebuild the
      # crate. Because Swatinem/rust-cache restores `target/` across runs, a PR
      # that only added a migration could go GREEN with that migration never
      # compiled in, and `indexer --migrate-only` built from that cache would
      # not apply it. `services/explorer-indexer/build.rs` now supplies the
      # missing dependency.
      #
      # migration_set_parity.rs is the guard on that mechanism: it compares the
      # compile-time embedded set against the run-time contents of
      # `migrations/`, so deleting or breaking build.rs turns this RED.
      #
      # It belongs in this LIGHT suite rather than suite 8
      # (explorer-indexer-fast) for two reasons: it needs no Postgres, no Docker
      # and no network — it is a filesystem walk plus an iteration over an
      # embedded static — and its subject is the BUILD, so it must run on every
      # Rust change including drafts. Suite 8 is `system-correctness` and skips
      # draft PRs entirely, which is exactly when a stale `target/` bites.
      # Wrapped in the executed-count guard so a zero-tests-collected run fails
      # RED, never silent-green.
      - name: Indexer embedded-migration parity guard
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p explorer-indexer \
            --test migration_set_parity -- --nocapture

  audit:
    name: rust-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (all workspace lockfiles)
        # Scans every Cargo.lock in the repo for RustSec advisories. Today that
        # is only the root workspace lockfile: every Rust package here is a
        # workspace member and resolves against it. The four standalone member
        # lockfiles were removed in #1202 (cargo never read or regenerated them,
        # so they drifted). The loop is retained so a genuinely standalone
        # workspace added later is picked up without editing this step.
        # cargo audit exits non-zero on any vulnerability advisory; sub-high
        # findings are suppressed via the dated ignore list in .cargo/audit.toml,
        # so the gate has a green baseline and blocks merges on any NEW advisory.
        # To accept a known low-risk advisory temporarily, add its RUSTSEC id to
        # the [advisories] ignore list in .cargo/audit.toml with a dated reason.
        # cargo audit auto-discovers .cargo/audit.toml from the working directory
        # (the repo root here), so the ignore list applies to every lockfile.
        run: |
          set -euo pipefail
          status=0
          for lock in $(find . -name Cargo.lock -not -path '*/target/*' | sort); do
            echo "::group::cargo audit $lock"
            cargo audit -f "$lock" || status=1
            echo "::endgroup::"
          done
          exit $status

  doc-coverage:
    name: rust-doc-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build --all-targets
        run: cargo build --all-targets

      - name: cargo doc + coverage check
        run: |
          mkdir -p "${RUNNER_TEMP}/robotmoney-rustdoc"
          RUSTDOC_LOG="${RUNNER_TEMP}/robotmoney-rustdoc/rustdoc.log"
          cargo doc --no-deps --all-features 2>&1 | tee "${RUSTDOC_LOG}"
          python3 .github/scripts/check_rustdoc_coverage.py "${RUSTDOC_LOG}"

  # INTEGRATION-TEST TARGET COVERAGE (issue #1282)
  #
  # Every Rust suite in this repository names its cargo test binaries by hand.
  # There is no bare `cargo test` over a package and no `--test '*'` anywhere in
  # .github/workflows, so adding a tests/<name>.rs file adds ZERO CI coverage
  # unless a workflow is edited in the same change -- and nothing detected the
  # omission. When this check was written it found 35 of 83 integration targets
  # executed by nothing, including BOTH explorer-indexer reorg suites (issue
  # #1283 shipped through that hole), clients/explorer-api/tests/endpoints.rs
  # (42 tests) and clients/rust-payment-client/tests/cli_deposit.rs (687 lines).
  #
  # cargo_test_require_executed.sh already fails a target that IS invoked but
  # collects zero tests. It cannot see a target nobody invoked. This job closes
  # that half: it enumerates every target, resolves which (package, target)
  # pairs the workflows actually run, and fails on any that is neither executed
  # nor allowlisted with a stated reason.
  #
  # WHY IT IS ITS OWN JOB AND NOT A STEP IN `lint`
  # It is pure Python over YAML and source paths -- no toolchain, no cargo cache,
  # seconds to run. As its own job it reports independently and gives its answer
  # even when the Rust build is broken, which is exactly when someone is most
  # likely to be adding a test file.
  #
  # The second step drives the checker's OWN failure paths against synthetic
  # trees (a dark target, an allowlist entry with no reason, a stale entry, an
  # entry naming a target that does not exist). Without it the checker would
  # only ever be observed passing, and a guard whose failure path never executes
  # is a guard nobody has checked -- the same argument the manifest-ahead guard's
  # self-test makes in suite 7.
  test-target-coverage:
    name: cargo-test-target-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Every integration-test target is executed or allowlisted
        run: python3 .github/scripts/check_cargo_test_target_coverage.py --list-executed

      - name: Exercise the coverage checker's failure paths
        run: bash .github/scripts/tests/test_check_cargo_test_target_coverage.sh
