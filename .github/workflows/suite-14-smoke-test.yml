# Canonical: docs/development/ci-suites.md §14
#
# WHY THIS SUITE EXISTS
# This suite is the CI contract for `make testnet`: the cli_meta matrix entry boots
# `cargo run -p smoke-test -- --full-stack` — the exact path `make testnet` runs — so a
# devnet boot regression (e.g. a deploy script drifting from a contract invariant, like
# the RouterGovernance ExecutionDelayBelowMinimum revert) is caught in CI on push to
# main/dev/dev-phase-* and in the nightly full-suite run (suite-21), not only when a
# human next runs `make testnet` locally.
#
# The smoke-test crate is the shared devnet fixture used by suites 7, 8, 10, 11, and 12.
# If Fixture::new() is broken — because a Docker image changed, the genesis script
# regressed, or a port mapping shifted — every one of those suites will fail at boot
# time with a confusing "connection refused" error, not a "fixture broken" error. Validating
# the fixture in isolation, on every change to the devnet config, means a broken fixture
# is caught and diagnosed here, in ~5 min, rather than discovered as mysterious failures
# across five other suites.
#
# WHY --test-threads=1
# The smoke-test crate boots Geth+Lighthouse on a fixed port (8545). If multiple tests
# run in parallel within the binary, they race to bind the same port and fail with
# "address already in use". This is the same constraint as suite 7; the fix is the same.
#
# WHY cargo build RUNS BEFORE cargo test
# The smoke-test crate includes a CLI binary (`cargo run smoke-test`). Building it
# explicitly before the test run ensures that both the library and the binary compile
# cleanly. Without this step, a binary-only compile error would be hidden by cargo test
# (which does not build binaries by default).
#
# WHY THE CLI META TEST RUNS SEPARATELY
# The `cli_meta` integration test boots `cargo run -p smoke-test -- --full-stack`
# and checks the harness contract around endpoint summary output, `--dapp-port`,
# and Ctrl-C teardown. Keeping it as its own cargo invocation makes failures easier
# to interpret than mixing it into the shared fixture suite.
#
# WHY THE SAFETY-NET TEARDOWN USES || true
# The teardown runs with if: always(), including when the job is cancelled by GitHub
# Actions (e.g. timeout). In that case, docker compose down may fail because the
# container was never started. The || true prevents the teardown step from overwriting
# the real failure exit code with a docker error exit code in the job summary.
#
# GOTCHAS
# - The Cargo cache path is testing/smoke-test/target, not the workspace root target.
#   This crate is not part of the main workspace Cargo.toml (by design — it has its own
#   version pin for devnet tooling). If you add it to the workspace, move the cache path
#   to target/ and add smoke-test/Cargo.toml to all other cache keys.
# - The safety-net teardown runs docker compose down from testing/ethereum-testnet/config.
#   This is the directory that contains the docker-compose.yml used by the fixture. If
#   the fixture is ever moved or the compose file is renamed, update this path.

name: smoke-test-devnet-boot-teardown

on:
  # HEAVY tier: this devnet boot/teardown suite is a merge gate for `dev` — it
  # runs on every pull_request targeting dev (no path filter, so the gate always
  # reports for any branch merging to dev) and on push to dev for merged-commit
  # coverage. See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Hermetic guards that need the binary/lib but NO Docker. Kept as their own fast
  # job so a manifest/alignment regression fails in seconds, before paying for any
  # container boot in the devnet matrix below.
  guards:
    name: smoke-test-guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # feature-correctness (not system-correctness): this job runs on every
    # PR including drafts (no draft-exclusion `if:`), matching
    # feature-correctness's pr_draft:run/pr_r4r:run shape. See the `devnet`
    # job below for why the heavier integration job below is classed the
    # same way despite being system-correctness by content.
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # check-fork-manifest.sh uses `cast index` to validate the harness USDC
      # balance slot in the produced genesis alloc, so Foundry is required even
      # though this job never boots a devnet.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build (includes CLI binary)
        working-directory: testing/smoke-test
        run: cargo build -p smoke-test

      # A crate's tests/ binaries are compiled by NOTHING in `cargo test --lib`
      # (issue #1295). `--all-targets` type-checks them here, in the job named
      # after the crate, so a struct literal that went short of a newly-required
      # field fails in THIS job rather than only in the workspace-wide rust-lint
      # nine minutes later. Enforced by
      # .github/scripts/check_rust_test_target_compile_coverage.py.
      - name: cargo clippy -p smoke-test --all-targets (compiles tests/ binaries)
        run: cargo clippy -p smoke-test --all-targets -- -D warnings

      # Issue #255 CI gate: validate fork-block.json against every rule in
      # smoke_test::fork_manifest, and run the genesis-alloc ingester against
      # the committed Anvil fixture to assert the canonical Base USDC ends up
      # in the produced alloc with non-empty bytecode and the harness USDC
      # balance + totalSupply slots. Fast (<5s once binaries are built); a
      # broken manifest is caught before any container boot is attempted.
      - name: fork-block manifest + alloc-ingester guard
        run: bash scripts/devnet/check-fork-manifest.sh

      # Issue #558 CI gate: assert fork-block.json, expected-prices.json, and
      # ingested_addresses stay in sync after a fork-block bump.  Runs as a
      # hermetic lib-test (no Docker required).  Also exercises the simulated
      # failure path that proves the guard detects an un-ingested pool.
      - name: fork-block alignment guard (expected-prices + ingested pools)
        working-directory: testing/smoke-test
        run: cargo test -p smoke-test --lib fork_manifest::tests -- --nocapture

      # Hermetic unit tests for the boot harness internals: the zombie-reaper
      # stale-vs-current classification (run-id labels) and the compose collision
      # guard. No Docker required — exercises the pure decision logic so a reaper
      # regression is caught here in seconds rather than as a mysterious zombie
      # collision in the devnet matrix below.
      - name: harness unit tests (reaper + compose guard, hermetic)
        working-directory: testing/smoke-test
        run: "cargo test -p smoke-test --lib tests:: -- --nocapture"

  # PARALLEL DEVNET MATRIX (issue #600): each devnet-booting binary used to run as a
  # SERIAL step in one job, each booting Geth+Lighthouse on port 8545 (suite ~38m).
  # Splitting them into a matrix gives one runner per binary, each booting + tearing
  # down its OWN stack with `if: always()`, removing the shared-port-8545 contention
  # (suite ~38m -> ~18m). fail-fast: false keeps every binary's signal independent.
  #   - cli_meta:            boots `smoke-test --full-stack`, asserts summary + Ctrl-C teardown
  #   - fixture_meta:        boots devnet, deploys contracts, asserts RPC + block production
  #   - demo_seeding:        boots the four-vault catalog and asserts all four vaults seed
  #   - full_stack_demo_tvl: boots full compose stack, asserts all four PRD §11 vaults report non-zero TVL
  #   - faucet_eth:          native Base ETH faucet drip round-trip (issue #466)
  #   - faucet_rm:           RM token faucet drip round-trip (issue #365)
  #   - fund_usdc:           real-signed-transfer assertions incl. the Geth-not-Anvil check (issue #255 step 7)
  #   - governance:          RouterGovernance deploy + setVotingPower round-trip (issue #364)
  #
  # faucet_eth/faucet_rm/fund_usdc/governance were folded in by issue #1311: each
  # only adds a Fixture boot (already paid by every other row) plus a handful of
  # RPC round-trips on top, so each row's wall-clock is expected to land near
  # fixture_meta's measured CI cost (~18 min) rather than full_stack_demo_tvl's
  # ~46 min. Because the matrix runs in parallel, the suite's total wall-clock
  # stays bounded by the slowest row (full_stack_demo_tvl); these four rows add
  # runner-minutes, not suite latency. See docs/development/ci-suites.md §14
  # ("Resolution of the five smoke-test devnet targets") for the measured
  # figures and the cost tradeoff this was weighed against. `vault_deposit_redeem`
  # was deleted instead of wired: both of its assertions were already made by a
  # suite that runs -- vault_on_chain_state -> fixture_meta's
  # vault_has_zero_exit_fee_and_one_active_adapter; the deposit/redeem round
  # trip -> rmpc-fork-e2e::vault_deposit_redeem_smoke (suite-05 anvil-goldens,
  # confirmed genuinely executing, not skipped). rmpc-fork-e2e's
  # devnet_adapter_round_trip is NOT counted as coverage here despite suite-05
  # naming it: it unconditionally self-skips in CI (RMPC_FORK_RPC_URL is never
  # set there -- issue #1239), so citing it would repeat the exact false-green
  # pattern this file exists to prevent.
  devnet:
    name: smoke-test-devnet-${{ matrix.binary }}
    runs-on: ubuntu-latest
    # 70 min (was 45): full_stack_demo_tvl boots the entire compose stack and,
    # since the rust-services image is built from source, recompiles the indexer
    # (cargo --release) before the 90s indexer-settle wait — on slower
    # GitHub-hosted runners this tipped the heaviest binary past the 45-min cap
    # and it was cancelled at exactly 45m (issue #880). 70 min gives headroom for
    # the build + boot + settle without masking a genuinely hung boot. The four
    # rows added by issue #1311 (faucet_eth, faucet_rm, fund_usdc, governance) are
    # all lighter than fixture_meta, so the existing 70-min ceiling already covers
    # them with headroom.
    timeout-minutes: 70
    # feature-correctness, not system-correctness, despite this being a full
    # devnet integration matrix: this job has no draft-exclusion `if:` and
    # runs on every PR to dev including drafts (pre-existing, by design --
    # see "WHY THIS SUITE EXISTS" above: a broken Fixture::new() must be
    # caught here before suites 7/8/10/11/12 pay their own boot cost).
    # system-correctness mandates skip-on-draft, which would misdescribe
    # this job's actual (intentional) trigger shape -- declaring it here
    # would make `ci lint` flag a must-not-run-pr_draft error against
    # behavior nobody wants changed. feature-correctness is the class whose
    # cells actually match what this job does today.
    env:
      CI_CLASS: feature-correctness
    strategy:
      fail-fast: false
      matrix:
        binary:
          [
            cli_meta,
            fixture_meta,
            demo_seeding,
            full_stack_demo_tvl,
            faucet_eth,
            faucet_rm,
            fund_usdc,
            governance,
          ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # Pre-pull the chain images (geth + lighthouse) BEFORE the boot clock
      # starts (issue #988). Without this, `Fixture::new()`'s
      # `docker compose up --build` pulls ethereum/client-go + sigp/lighthouse
      # inline on a cold runner — on a slow runner this image pull alone was
      # ~13 min, eating into the test's BOOT_TIMEOUT budget and timing out
      # cli_meta right as seeding finished (the boot completed; the budget was
      # the limiter). Pulling here moves that runner-variant pull off the boot
      # critical path, the same way suite-07 already does for the e2e devnet.
      # `--ignore-pull-failures` skips the build-only `setup` service (no
      # `image:`), and `|| true` keeps a transient registry hiccup from failing
      # the job before the test even runs. Only docker-compose.yaml is pulled:
      # docker-compose.dapp.yaml requires deploy-time env (gateway/vault
      # addresses) that does not exist this early, and its only pullable image
      # (postgres:16-alpine) is small and not on the slow critical path.
      - name: Pre-pull Docker images
        working-directory: testing/ethereum-testnet/config
        run: docker compose -f docker-compose.yaml pull --ignore-pull-failures || true

      - name: cargo build (includes CLI binary)
        working-directory: testing/smoke-test
        run: cargo build -p smoke-test

      # The four-vault real-TVL gate (issue #592) IS the `demo_seeding` matrix
      # binary: `cargo test --release --test demo_seeding` asserts the
      # VaultRegistry lists exactly four Active vaults (PRD §11.1–§11.4), the
      # router weights cover all four router-eligible vaults summing to 10000
      # bps with the 8500/500/500/500 split (the deSPXA RWA vault is
      # router-eligible at 500 bps — ADR-0006 §1 amended 2026-06-05 / issue
      # #621), and that **all four** vaults report non-zero on-chain
      # totalAssets after seeding. It therefore runs exactly once across this
      # matrix — on the `demo_seeding` binary — and is NOT re-appended as an
      # unconditional final step on every binary (issue #915): that previously
      # booted a second devnet + reseed on cli_meta/fixture_meta/full_stack_demo_tvl
      # (~25 min each on full_stack_demo_tvl) with zero net coverage, since the
      # assertions already run as the demo_seeding binary. Runs single-threaded
      # for the same fixed-port reason as fixture_meta.
      #
      # Routed through cargo_test_require_executed.sh (issue #1311 AC) so a run
      # that collects zero tests (e.g. a --test filter that silently matched
      # nothing) fails loudly instead of reporting a false green — the same
      # guard suites 4/6/7/8/20 already use.
      - name: cargo test (${{ matrix.binary }} — boots + tears down its own devnet)
        working-directory: testing/smoke-test
        env:
          SMOKE_TEST_LOG_FILE: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test-${{ matrix.binary }}.log
        run: >-
          bash ../../.github/scripts/cargo_test_require_executed.sh
          -p smoke-test --release --test ${{ matrix.binary }} -- --test-threads=1 --nocapture

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.binary }}
          path: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test*.log*

      - name: Safety-net teardown (always)
        if: always()
        working-directory: testing/ethereum-testnet/config
        run: docker compose down -v --remove-orphans || true
