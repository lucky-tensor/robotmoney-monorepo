# Canonical: docs/development/ci-suites.md §9
# Enforces: docs/development/react-guide.md (lint + fmt + tsc + vitest + build gates each PR).
#
# WHY THIS SUITE EXISTS
# The dApp handles key generation in the browser. A type error in the keygen path or a
# build regression that ships undefined where a key should be can silently fail for
# users without any visible error. This suite is the gate that ensures the dApp ships
# as valid TypeScript, passes ESLint's security rules (no key material leaking to DOM
# via console.log), and produces a working production bundle — all without needing a
# running chain.
#
# WHY ALL STEPS ARE IN ONE JOB
# These checks are fast (~3 min total) and always run together. Splitting them into
# separate jobs would add GitHub Actions scheduling overhead for no parallelism benefit.
# The one exception where splitting would matter is if tsc and vitest were independent
# slow steps, but they are not.
#
# WHY --frozen-lockfile
# The lockfile is the contract between the repo and the exact dependency versions that
# were tested. Without --frozen-lockfile, pnpm may silently upgrade transitive
# dependencies on every CI run, making builds non-reproducible and masking
# dependency-introduced regressions.
#
# WHY bun audit --audit-level=high
# The dApp handles key generation in the browser; a compromised dependency could silently
# exfiltrate key material. Auditing at high severity (CVSS >= 7.0) catches supply-chain
# attacks before they reach users. --audit-level=high matches the threshold used by
# cargo audit and avoids noise from informational/low findings in dev tooling.
#
# GOTCHAS
# - pnpm fmt runs Prettier in check mode. If a developer commits auto-formatted code
#   from an IDE that uses a different Prettier version, this step will fail with a diff.
#   The fix is always to run pnpm fmt locally (not to bump the Prettier version in CI).
# - pnpm build produces a Vite bundle. A successful build does not mean the app works
#   at runtime — it only means the bundle is syntactically valid. The E2E tests in
#   suite 10 cover runtime correctness.
# - Node 22 is pinned. If a dependency drops Node 22 support, this step will fail at
#   install time with a peer dependency error, not at test time.
# - bun audit exits non-zero if any high/critical vulnerability is found. The audit
#   runs via scripts/audit-deps.sh, which carries a dated allowlist of pre-existing
#   advisories. To accept a known advisory temporarily, add its GHSA id to that
#   allowlist with a reason and expiry. Do not lower --audit-level.

name: dapp-lint-typecheck-vitest-build

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI taxonomy: this suite proves one component (the dApp) is internally correct
# — lint, types, unit tests, and a production bundle — with no external
# environment. Runtime/system correctness is suite 10's job.
env:
  CI_CLASS: feature-correctness

jobs:
  lint-build:
    name: dapp-lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/dapp
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check
        run: bun run fmt

      - name: ESLint
        run: bun run lint

      - name: TypeScript type check
        run: bunx tsc -b

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      # MUST run before Vitest: tests/unit/csp.test.ts asserts on the built
      # dist/index.html and now fails loudly when that artifact is absent
      # (issue #1383). Previously this step ran after Vitest, so the CSP
      # production-build assertion silently no-opped and reported green.
      - name: Production build
        # VITE_GIT_COMMIT is consumed by vite.config.ts (via process.env.VITE_GIT_COMMIT)
        # so the About modal always shows a non-empty 12-char SHA in CI, preview, and
        # Docker builds — not the 'unknown' fallback (issue #940).
        env:
          VITE_GIT_COMMIT: ${{ github.sha }}
        run: bun run build

      - name: Vitest
        run: bun run test

      - name: Dependency vulnerability audit
        # Scans for high and critical severity advisories (CVSS >= 7.0) via
        # `bun audit --audit-level=high`. We use bun (not npm) because the
        # lockfile is bun.lock; npm audit fails with ENOLOCK here.
        # Pre-existing advisories that cannot yet be upgraded are suppressed in
        # scripts/audit-deps.sh with dated justifications. Any NEW high/critical
        # advisory fails the build. Do not lower the audit level.
        run: bash scripts/audit-deps.sh

      # Issue #665: enforce the strict CSP before public launch. Serves the
      # built bundle via `vite preview` and asserts the Content-Security-Policy
      # response header contains script-src and neither unsafe-inline nor
      # unsafe-eval. See clients/dapp/scripts/check-csp.sh.
      - name: Enforce strict CSP
        run: bash scripts/check-csp.sh

      # Issue #671: enforce HSTS preload before public launch. Serves the built
      # bundle via `vite preview` and asserts the Strict-Transport-Security
      # response header contains max-age=31536000, includeSubDomains, and
      # preload — the minimum required for HSTS preload list eligibility.
      # Uses a different port (4174) to avoid conflicts with the CSP check.
      # See clients/dapp/scripts/check-hsts.sh.
      - name: Enforce HSTS preload header
        run: bash scripts/check-hsts.sh
