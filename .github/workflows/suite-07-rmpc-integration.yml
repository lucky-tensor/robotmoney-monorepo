# Canonical: docs/development/ci-suites.md §7
#
# WHY THIS SUITE EXISTS
# rmpc must work end-to-end against a real consensus layer (Geth + Lighthouse), not just
# Anvil. The devnet runs a full PoS chain with real slot timing, which surfaces bugs in
# confirmation logic, block-number handling, and receipt polling that Anvil's instant
# finality hides. This is the suite that catches "works on anvil, breaks on mainnet"
# regressions.
#
# WHY EACH TEST BINARY RUNS SEPARATELY WITH docker compose down -v BETWEEN THEM
# Each test binary boots its own devnet on port 8545 using a shared Fixture in a
# OnceLock. Rust does not destruct statics on process exit, so Drop on the Fixture is
# not guaranteed to run — the compose stack is left running after the binary exits.
# If the next binary runs compose up against an already-running stack, the genesis
# setup container re-runs against a populated volume and exits 1, hanging the test.
# The explicit teardown between binaries is load-bearing; do not remove it.
#
# WHY skill_docs_parity, dapp_toml_roundtrip, committee, receipt,
# cli_committee_identity AND cli_version RUN HERE BEFORE THE DOCKER TESTS
# These tests require the rmpc binary but no chain. Running them first means that if
# the plugin manifest, TOML config, or committee register/vote-submit calldata path
# drifts, CI fails fast (< 1 min) before paying for the Docker boot. They are in this
# suite rather than suite 6 because they depend on the release binary being built.
# The committee test (clients/rust-payment-client/tests/committee.rs, issue #1105) mocks
# the JSON-RPC server with mockito and drives the real `rmpc committee register` /
# `vote-submit` binary via assert_cmd — no live chain, so it belongs in the binary-only
# parity job, not the devnet matrix. The receipt test
# (clients/rust-payment-client/tests/receipt.rs, issue #1247) is the same shape and is
# the only executor of the consensus-receipt canonicalization goldens and of the
# anchor-digest constants (issue #1280). The cli_committee_identity test (issue #1111) drives
# `rmpc committee-identity create/show-public-key/sign` the same way — no RPC/mockito
# needed at all, it is a pure local Ed25519 keystore. The cli_version test
# (clients/rust-payment-client/tests/cli_version.rs, issue #1191) asserts the built
# binary reports the manifest version and not the 0.1.0 placeholder that shipped in six
# tagged releases — it needs the release binary and no chain, so it belongs here too.
# All four are wrapped in cargo_test_require_executed.sh so a zero-tests-collected run
# fails RED instead of a silent green.
#
# NOTE ON THE cli_version STEP: it is the ONLY place in PR CI that executes
# tests/cli_version.rs. Suite 6 runs `cargo test --lib`, which never builds the
# tests/ integration targets, and the release workflow's tag/version assertion only
# fires at release time. Delete this step and the #1191 regression goes back to being
# invisible until an operator downloads a mislabelled archive.
#
# WHY THERE IS A SECOND, SEPARATE VERSION STEP
# cli_version.rs asserts binary == manifest — both sides come from Cargo.toml, so it
# is tautological on STALENESS. The harm in #1191 was staleness (manifest frozen at
# 0.1.0 across six releases), and leaving the manifest on an already-published
# version reproduces it exactly: every build then self-identifies as the shipped
# release. assert_manifest_ahead_of_tags.sh checks the ordering invariant instead —
# manifest strictly ahead of the newest rmpc release tag — which no in-crate test can see,
# because it is a property of repository state rather than of the crate. Because that
# guard only ever sees the ONE tag arrangement that passes, its failure paths are
# exercised separately against synthetic repos by
# .github/scripts/tests/test_assert_manifest_ahead_of_tags.sh.
#
# Only `rmpc-v*.*.*` tags count towards that ordering (issue #1243). The bare
# `v*.*.*` namespace belongs to release-dapp.yml, and while the guard globbed it
# too, a dApp-only release blocked every rmpc PR until the rmpc crate was bumped
# past a version chosen for the dApp.
#
# Its counterpart, .github/scripts/tests/test_bump_rmpc_manifest.sh, exercises the
# other half of the same contract: release-rmpc.yml's post-release bump, which is
# what stops a published release leaving `dev` in the state the guard rejects.
# Neither script's real caller runs on a PR — one is scoped to rmpc-crate changes,
# the other fires only on a tag — so these two exercises are the only place either
# is executed before it matters.
#
# WHY nonce-race-stress IS A SEPARATE JOB (NOT A STEP)
# The race test runs 100 iterations of concurrent nonce acquisition and is sensitive to
# runner load. Mixing it into geth-tests would make timing-dependent failures ambiguous
# (is it the race or the chain interaction?). A separate job isolates the failure signal.
#
# GOTCHAS
# - docker compose pull --ignore-pull-failures caches images before the tests start.
#   If this step is removed, each compose up pulls images inline, adding 2–5 min and
#   making the run non-hermetic (image tags can change between pulls).
# - --test-threads=1 is required for all devnet test binaries. Parallel tests in the
#   same binary would race on port 8545. Do not remove this flag.
# - The "Tear down docker (always)" step uses if: always() so it fires even when an
#   earlier step panics. Without it, a panicking test can leave the stack running and
#   corrupt the next job on the same runner (self-hosted runners only, but worth noting).

name: rust-client-devnet-integration

# CI taxonomy (issue #1105): this suite proves rmpc end-to-end against a real
# devnet plus binary-level integration tests (parity, committee register/vote-submit)
# — the `system-correctness` class. It defers past drafts to ready_for_review and is
# bypassed on docs-only changes.
env:
  CI_CLASS: system-correctness

on:
  # system-correctness: this devnet integration suite is a merge gate for `dev`. It
  # defers past draft PRs (ready_for_review onward) so drafts are not charged for the
  # Docker boot, and runs on push to dev for merged-commit coverage. paths-ignore
  # bypasses docs-only PRs. See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Non-devnet rmpc tests that need the release binary but no chain. Kept in this
  # suite (rather than suite 6) because they depend on the release build; split into
  # their own fast job so a manifest/TOML drift fails in <1 min without booting Docker.
  parity:
    name: rmpc-parity
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 25 (was 20): the CLI-surface step added by issue #1282 runs 16 previously
    # dark integration targets (67 tests, ~22s locally) on top of the existing
    # parity steps. The extra margin covers a cold cargo cache building those
    # sixteen test binaries.
    timeout-minutes: 25
    # Read-only, and stated rather than inherited: `Collect the changed-path list`
    # calls the pulls/compare APIs, which need pull-requests/contents read even
    # though nothing in this job writes.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # WHY THE VERSION GUARDS RUN BEFORE `Build rmpc binary` (issue #1243)
      # They need no toolchain and no binary — one is a tag comparison, the other
      # drives synthetic git repos — and they run in seconds. Sitting at the end
      # of this job, a stale manifest made every blocked PR pay a full
      # `cargo build --release` plus four cargo test steps before it heard about
      # it. The toolchain and cache steps above still precede them because the
      # cargo steps below want them warm regardless of how this job ends.
      #
      # The half cli_version.rs structurally CANNOT cover (issue #1191 review).
      # That test compares the binary's output against env!("CARGO_PKG_VERSION"),
      # so both sides come from the same manifest — it is tautological on
      # staleness by construction. It proves the binary agrees with the manifest;
      # it can never prove the manifest says anything true about which build you
      # are holding. The failure that actually shipped WAS staleness: the manifest
      # sat at 0.1.0 through six releases. Parking it on an already-published
      # version reproduces that harm with a different string, and a release-time
      # `manifest == tag` check PASSES for such a build, certifying the collision.
      # So the invariant is ordering, not equality — and it is only checkable
      # against repository state (the tag list), never from inside the crate.
      #
      # WHY THE CHANGED-PATH LIST (issue #1243)
      # The guard's subject is the rmpc manifest and the state it reports is a
      # property of the BRANCH, not of the change under review. Unscoped, the
      # instant a release published, every open PR in the repository went red on
      # a fact none of them introduced and none of them could fix. The list is
      # read from the GitHub API rather than from git history because this
      # checkout is shallow. An empty file (workflow_dispatch, or an API hiccup)
      # runs the guard UNSCOPED — the fail-safe direction; see the guard's own
      # comment block.
      - name: Collect the changed-path list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/changed-paths.txt"
          : > "$OUT"
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ]; then
            gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "$OUT" || : > "$OUT"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            gh api "repos/${REPO}/compare/${BEFORE_SHA}...${AFTER_SHA}" --jq '.files[].filename' > "$OUT" || : > "$OUT"
          fi
          echo "changed paths: $(wc -l < "$OUT" | tr -d ' ')"
          # The API caps a compare at 300 files and paginates pulls/files to
          # 3000. A truncated list can only cause a SKIP, never a wrong verdict:
          # the guard reports branch state, and the change that clears that state
          # (the post-release bump) is a one-file PR.

      - name: rmpc manifest version is ahead of every published rmpc release
        run: |
          set -euo pipefail
          # Both namespaces: `refs/tags/v*` does NOT match `rmpc-v*`. The retired
          # v*.*.* tags are the guard's fetch canary; the rmpc-v* tags are its
          # actual subject.
          git fetch --depth=1 --no-recurse-submodules origin \
            '+refs/tags/v*:refs/tags/v*' '+refs/tags/rmpc-v*:refs/tags/rmpc-v*'
          bash .github/scripts/assert_manifest_ahead_of_tags.sh \
            clients/rust-payment-client/Cargo.toml \
            --changed-paths-from "${RUNNER_TEMP}/changed-paths.txt"

      # The step above can only ever see ONE tag arrangement — the real one, in
      # the arrangement that passes — so every branch of that guard that MATTERS
      # (collision, regression, tagless checkout, prerelease ordering, a foreign
      # dApp tag, the post-release state, the out-of-scope skip) is unreachable
      # in CI and has never executed. This drives it against synthetic
      # repositories per case and asserts the exit code each must produce,
      # including the semver prerelease ordering `sort -V` gets backwards. No
      # network, no build, no real tags — it runs in seconds.
      - name: Exercise the manifest-ahead guard's failure paths
        run: bash .github/scripts/tests/test_assert_manifest_ahead_of_tags.sh

      # release-rmpc.yml's post-release bump (issue #1243) is what stops a
      # release leaving `dev` in the state the guard above rejects. That workflow
      # fires only on a tag, so without this step its bump logic would first
      # execute during a real release, on dev, holding contents: write.
      - name: Exercise the post-release manifest bump
        run: bash .github/scripts/tests/test_bump_rmpc_manifest.sh

      - name: Build rmpc binary
        run: cargo build --release --manifest-path clients/rust-payment-client/Cargo.toml --bin rmpc

      - name: Skill-package parity
        working-directory: clients/rust-payment-client
        run: cargo test --test skill_docs_parity -- --nocapture

      - name: dApp TOML round-trip
        working-directory: clients/rust-payment-client
        run: cargo test --test dapp_toml_roundtrip -- --nocapture

      # Investment-Committee register / vote-submit integration test (issue #1105).
      # mockito-backed, drives the release rmpc binary via assert_cmd. Wrapped in the
      # executed-count guard so a zero-tests-collected run fails RED, never silent-green.
      - name: rmpc committee register / vote-submit
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            --release \
            --manifest-path clients/rust-payment-client/Cargo.toml \
            --test committee -- --nocapture

      # Consensus recommendation receipt: canonicalization goldens + the anchoring
      # refusal gate (issue #1247, and the second half of issue #1280).
      # mockito-backed, drives the release rmpc binary via assert_cmd — no chain.
      #
      # WHY THIS STEP IS LOAD-BEARING AND NOT OPTIONAL
      # tests/receipt.rs is the ONLY executor of two pins. (1) The canonical
      # bytes are byte-identical across robotmoney-core and robotmoney-frontend;
      # consensus-receipt.escaping.canonical.txt is the fixture that catches a
      # serializer escaping non-ASCII, U+2028 or the HTML-sensitive characters,
      # and an all-ASCII check passes for every such serializer. (2)
      # consensus-receipt.anchor-digest.json's keccak256 constants are compared
      # against hashes derived at test time AND against the payloadDigest the
      # `rmpc receipt submit` calldata actually carries — the half #1280 could
      # not discharge until a consensusRecordReceipt implementation existed.
      # Suite 6 runs `cargo test --lib`, which never builds tests/ integration
      # targets, so without this step nothing in PR CI executes either pin.
      # Wrapped in the executed-count guard so a zero-tests-collected run fails
      # RED, never silent-green.
      - name: rmpc receipt verify / submit (consensus receipt anchoring)
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            --release \
            --manifest-path clients/rust-payment-client/Cargo.toml \
            --test receipt -- --nocapture

      # Investment-Committee MCP identity: create / show-public-key / sign
      # (issue #1111). No RPC, no chain, no external resource — pure local
      # Ed25519 crypto driven through the release rmpc binary via assert_cmd.
      # Wrapped in the executed-count guard so a zero-tests-collected run
      # fails RED, never silent-green.
      - name: rmpc committee-identity create / show-public-key / sign
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            --release \
            --manifest-path clients/rust-payment-client/Cargo.toml \
            --test cli_committee_identity -- --nocapture

      # Version identifiability (issue #1191): the released binary reported
      # `rmpc 0.1.0` regardless of the tag it was published under, so an operator
      # could not say which build they were running. This drives the built binary
      # through assert_cmd and asserts `--version` reports the manifest version,
      # that the manifest is not back at the 0.1.0 placeholder, and that `-V`
      # agrees. No RPC, no chain, no external resource. Wrapped in the
      # executed-count guard so a zero-tests-collected run fails RED.
      - name: rmpc --version reports the manifest version
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            --release \
            --manifest-path clients/rust-payment-client/Cargo.toml \
            --test cli_version -- --nocapture

      # CLI SURFACE TESTS THAT NOTHING EXECUTED (issue #1282)
      # These sixteen targets existed and were dark: no job named them, so a
      # `grep -rn cli_deposit .github/` matched only an unrelated JSON fixture.
      # cli_deposit.rs alone is 687 lines and ten subprocess scenarios (happy
      # path, chain-id mismatch, paused gateway, fee cap, concurrent lock,
      # receipt timeout, duplicate replay, revert); the twelve cli_get_*.rs
      # suites are the entire read-command surface; deposit_router.rs covers
      # the multi-leg router deposit. Every one of them is mockito-backed and
      # drives the built rmpc binary through assert_cmd -- no chain, no Docker,
      # no fixture beyond a temp keystore -- which is why they belong in this
      # binary-only parity job and not the devnet matrix. Measured cost: 67
      # tests, ~22s wall clock on top of an already-built binary.
      #
      # tests/cli.rs is the clap parser-level target and needs no RPC at all.
      #
      # Wrapped in the executed-count guard so a zero-tests-collected run fails
      # RED rather than passing as a silent skip. The permanent guard against
      # this whole class -- a tests/*.rs file no workflow names -- is
      # .github/scripts/check_cargo_test_target_coverage.py, run in suite 4.
      - name: rmpc CLI surface (deposit, withdraw, router, status, self-check, get-*)
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            --release \
            --manifest-path clients/rust-payment-client/Cargo.toml \
            --test cli \
            --test cli_deposit \
            --test cli_withdraw \
            --test cli_withdraw_router \
            --test cli_status \
            --test cli_self_check \
            --test deposit_router \
            --test cli_get_agent \
            --test cli_get_allowance \
            --test cli_get_balance \
            --test cli_get_deposit \
            --test cli_get_gateway \
            --test cli_get_roles \
            --test cli_get_router \
            --test cli_get_timelock \
            --test cli_get_tx \
            --test cli_get_vault \
            --test cli_get_vaults -- --nocapture

  # PARALLEL DEVNET MATRIX (issue #600): each e2e binary booted its own Geth+Lighthouse
  # devnet on port 8545, so they were forced to run SERIALLY in one job with a
  # `docker compose down -v` between each (suite wall-clock ~45m). Splitting them into a
  # matrix gives one runner per binary, each booting + tearing down its OWN stack with
  # `if: always()`, removing the shared-port-8545 contention (suite ~45m -> ~13m).
  # fail-fast: false so one failing binary does not cancel the others, and the
  # per-binary green/red signal stays independent.
  devnet-e2e:
    name: rmpc-e2e-${{ matrix.binary }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        binary: [smoke, scenarios, window_cap, withdraw]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Pre-pull Docker images
        working-directory: testing/ethereum-testnet/config
        run: docker compose pull --ignore-pull-failures || true

      - name: e2e ${{ matrix.binary }}
        working-directory: testing/ethereum-testnet/e2e-rust
        run: cargo test --release --test ${{ matrix.binary }} -- --test-threads=1 --nocapture

      - name: Tear down docker (always)
        if: always()
        working-directory: testing/ethereum-testnet/config
        run: docker compose down -v --remove-orphans || true

  nonce-race-stress:
    name: rmpc-nonce-race-stress
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run 100× stress
        run: bash .github/scripts/stress_nonce_race.sh
