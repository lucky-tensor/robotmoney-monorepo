# Canonical: docs/development/ci-suites.md §20
#
# WHY THIS SUITE EXISTS
# The security model (docs/technical/security-model.md §9) requires an automated
# watchdog to monitor per-block and per-hour mint/burn volume and trigger a pause
# or alert on breach. This suite verifies that the watchdog compiles, passes unit
# tests, and that the threshold-breach detection pipeline works end-to-end against
# a real Postgres testcontainer (volume queries → breach detection → alert dispatch).
#
# WHY TESTS ARE SPLIT INTO fast AND pg
# Unit tests (config validation, RLP encoding, alert payload shape) need no Docker.
# Breach detection and alert integration tests need a Postgres testcontainer.
# Splitting keeps the fast job under 5 minutes and lets the pg job fail independently
# without hiding unit test results.
#
# GOTCHAS
# - The threshold_breach tests start a MockWebhookServer on localhost. If the runner
#   is behind a strict firewall that blocks loopback TCP, the alert dispatch will fail.
#   GitHub-hosted ubuntu-latest runners have unrestricted loopback — no special setup.
# - The pg integration tests FAIL LOUDLY when Docker is unavailable: tests/common/mod.rs
#   ::pg_fixture panics with "[watchdog-tests] REQUIRED DEPENDENCY UNAVAILABLE: `docker`
#   is not on PATH". Until issue #1377 it was `try_pg_fixture() -> Option<PgFixture>` and
#   every caller wrote `else { return; }`, so a Docker-less runner printed
#   "10 passed" having asserted nothing. Do not reintroduce an Option-returning fixture:
#   if this job's runner ever loses Docker, the correct signal is red, not green.

name: watchdog-rate-monitor

# CI taxonomy (issue #1105, declared for this suite in issue #1384): this is a
# mixed workflow, so CI_CLASS is declared per job rather than at workflow level.
#
#   fast / watchdog-unit        -> feature-correctness
#     `cargo clippy -p watchdog --all-targets` + `cargo test -p watchdog --lib`.
#     Scoped unit tests, no Docker, no external resource. feature-correctness
#     runs on draft PRs, so this job's existing triggers already match its
#     class and needed no change.
#
#   pg   / watchdog-integration -> system-correctness
#     Every step boots a Postgres testcontainer and drives the breach-detection
#     pipeline end to end (volume queries -> breach detection -> alert dispatch,
#     plus cursor staleness / deposit-volume anomaly). Docker + a real database +
#     cross-component assertions is the definition of system-correctness; calling
#     it feature-correctness to keep it on drafts would be a dishonest label.
#
# THE DRAFT-COVERAGE DECISION (issue #1384)
# Before this file was declared, BOTH jobs ran on every pull request including
# drafts. system-correctness is `pr_draft: skip` in the taxonomy matrix, so
# declaring the pg job honestly forced a choice: keep draft-stage integration
# coverage and carry a permanent taxonomy violation, or defer the pg job to
# ready_for_review.
#
# DECIDED: defer. watchdog-integration no longer runs on draft PRs.
#   - The taxonomy has no exception mechanism: `must-not-run-pr_draft` is an
#     error, not a warning, so "deliberate exception" is not something this repo
#     can express — it would leave `ci lint` permanently red for this file and
#     re-open the same question on every future edit.
#   - What is actually lost is narrow: the ~1m24s pg job no longer reports while
#     a PR is a draft. The unit battery still runs on every draft push, and the
#     pg job runs in full at ready_for_review (which is why `ready_for_review`
#     is in the pull_request types below), on every subsequent push to the ready
#     PR, and on push to dev/dev-phase-* for merged-commit coverage. No commit
#     reaches dev without the mint/burn watchdog integration suite having run on
#     it, so the security-model.md §9 control is still proven before merge — it
#     is proven later in the PR's life, not less often.
#   - Cheapness is an argument for running it, but it is not an argument for
#     mislabelling it. If draft-stage integration feedback is later judged worth
#     the class violation, the honest fix is to change the taxonomy matrix in
#     agent-core, not to relabel this job.

on:
  # feature-correctness and system-correctness: run on pushes to dev/dev-phase-*
  # and code-bearing pull requests to any branch. ready_for_review is included
  # so the system-correctness integration job starts when a draft is promoted.
  # paths-ignore bypasses docs-only changes — neither job validates prose.
  push:
    branches: [dev, "dev-phase-*"]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  # `ci lint` warns `sweep-missing-nightly` on both jobs because it sees no
  # `schedule:` here. Nightly coverage is real but indirect: suite-21-nightly.yml
  # lists suite-20-watchdog.yml in its dispatch set and POSTs a workflow_dispatch
  # at 02:00 UTC against dev HEAD. The warning is a linter blind spot for the
  # dispatcher pattern this repo uses for every suite; do not add a `schedule:`
  # here, or the nightly sweep runs this suite twice.
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: watchdog-unit
    runs-on: ubuntu-latest
    env:
      CI_CLASS: feature-correctness
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # A crate's tests/ binaries are compiled by NOTHING in `cargo test --lib`
      # (issue #1295). `--all-targets` type-checks them here, in the job named
      # after the crate, so a struct literal that went short of a newly-required
      # field fails in THIS job rather than only in the workspace-wide rust-lint
      # nine minutes later. Enforced by
      # .github/scripts/check_rust_test_target_compile_coverage.py.
      - name: cargo clippy -p watchdog --all-targets (compiles tests/ binaries)
        run: cargo clippy -p watchdog --all-targets -- -D warnings

      - name: cargo test -p watchdog --lib (unit tests, no Docker)
        run: cargo test -p watchdog --lib -- --nocapture

  pg:
    name: watchdog-integration
    runs-on: ubuntu-latest
    env:
      CI_CLASS: system-correctness
    # system-correctness is deferred until the PR is ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 30 (was 20): issue #1282 added cursor_and_volume (7 tests, ~25s locally),
    # each test booting its own Postgres testcontainer.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build test binaries
        working-directory: services/watchdog
        run: cargo test --no-run

      - name: Alert webhook integration test
        working-directory: services/watchdog
        run: cargo test --test alert_webhook -- --nocapture

      - name: Threshold breach integration test
        working-directory: services/watchdog
        run: cargo test --test threshold_breach -- --nocapture

      # THE THIRD WATCHDOG TARGET NOTHING EXECUTED (issue #1282)
      # tests/cursor_and_volume.rs is 569 lines and the largest test file in the
      # crate -- it covers the indexer-cursor staleness alarm and the deposit
      # volume anomaly detector, i.e. the two conditions the watchdog exists to
      # raise. It was executed by no workflow: only alert_webhook and
      # threshold_breach were ever named. It uses the same
      # tests/common/mod.rs::pg_fixture Postgres testcontainer as the two
      # steps above, so it needs nothing this job does not already have.
      # Measured cost: 7 tests, ~25s wall clock locally.
      #
      # Wrapped in the executed-count guard so a zero-tests-collected run fails
      # RED rather than passing as a silent skip.
      - name: Cursor staleness + deposit volume anomaly integration test
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p watchdog \
            --test cursor_and_volume -- --test-threads=1 --nocapture
