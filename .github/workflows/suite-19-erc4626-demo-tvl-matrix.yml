# Canonical: docs/development/ci-suites.md §19
#
# WHY THIS SUITE EXISTS
# ERC-4626 PRECONDITION TESTS (activated — issue #814)
# contracts/test/ERC4626PreconditionChecks.t.sol asserts asset()/decimals()
# and empty-vault share-price invariants across the exitFeeBps × adapter matrix.
# The matrix shards by exit-fee tier via the EXIT_FEE_BPS env var. Anvil only —
# no Docker, no devnet.
#
# WHERE THE demo-tvl JOB WENT (issue #1371)
# This suite used to carry a second job, `demo-tvl-full-stack`, whose only step
# was `cargo test -p smoke-test --release --test full_stack_demo_tvl --
# --test-threads=1 --nocapture`. That is the *identical* cargo invocation on the
# *identical* test binary already run by the `full_stack_demo_tvl` row of
# suite-14's devnet matrix (.github/workflows/suite-14-smoke-test.yml), under
# identical triggers (`pull_request: branches: [dev]` + `push: [dev]`), so every
# PR into dev paid for the same devnet bring-up twice. Measured on dev commit
# 44299b40: demo-tvl-full-stack 45m51s (job 103087822627) alongside
# smoke-test-devnet-full_stack_demo_tvl 46m56s (job 103087891903), both green,
# both logging `test result: ok. 2 passed`.
#
# The suite-14 row is the one kept because it strictly dominates: it routes
# through .github/scripts/cargo_test_require_executed.sh (so a zero-collected
# run fails loudly instead of reporting a false green), pre-pulls the chain
# images off the boot critical path, and uploads the smoke-test log artifact.
# The job removed here had none of those. Host bun is NOT needed — the dapp
# bundle is built inside docker-compose.dapp.yaml, which is why the suite-14 row
# has always passed without oven-sh/setup-bun.
#
# The file name and workflow name keep the `demo-tvl` token on purpose: suite
# numbering is referenced by path from .github/workflows/suite-21-nightly.yml's
# dispatch list, docs/development/ci-suites.md §19, and
# docs/technical/testcode-removal-seams.md §2.5. Renaming is churn with no
# signal value; this comment and ci-suites.md §19 carry the truth instead.
#
# ACTIVATION HISTORY
# - erc4626-precondition: activated in issue #814 — ERC4626PreconditionChecks.t.sol
#   created and `if: false` removed.
# - demo-tvl: activated in issue #804 — full_stack_demo_tvl.rs exists; bun runner
#   dep resolved via oven-sh/setup-bun@v2. Removed in issue #1371 as an exact
#   duplicate of suite-14's `full_stack_demo_tvl` matrix row (see above).

name: erc4626-demo-tvl-matrix

on:
  # HEAVY tier: merge gate for `dev` — runs on every pull_request targeting dev
  # (no path filter, so the gate always reports for any branch merging to dev)
  # and on push to dev for merged-commit coverage.
  # See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suite is now a single forge-on-anvil job with no draft-exclusion `if:`, so
# it runs on every PR to dev including drafts — the feature-correctness trigger
# shape. Declared here (issue #1371) rather than left `undeclared`: removing the
# `demo-tvl` job meant touching this file, and `ci lint` requires errors: 0 on a
# touched workflow. The remaining `docs-only-should-skip` /
# `sweep-missing-nightly` warnings belong to the repo-wide CI_CLASS backfill and
# are explicitly out of scope for #1371.
env:
  CI_CLASS: feature-correctness

jobs:
  # ── ERC-4626 precondition checks ───────────────────────────────────────────
  # Activated in issue #814: contracts/test/ERC4626PreconditionChecks.t.sol asserts
  # asset()/decimals()/empty-vault share-price invariants for each exitFeeBps tier
  # × adapter (aave, compound, morpho). The matrix shards the run by
  # exit-fee tier; the test reads the EXIT_FEE_BPS env var for its matrix-env tier.
  erc4626-precondition:
    name: erc4626-precondition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        exit_fee_bps: [0, 30, 100]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge test ERC-4626 preconditions (exitFeeBps=${{ matrix.exit_fee_bps }})
        env:
          EXIT_FEE_BPS: ${{ matrix.exit_fee_bps }}
        run: |
          forge test \
            --match-contract ERC4626PreconditionChecks \
            --fuzz-runs 256 \
            -vv
