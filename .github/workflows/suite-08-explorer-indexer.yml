# Canonical: docs/development/ci-suites.md §8
#
# WHY THIS SUITE EXISTS
# The explorer indexer is the read path for the dApp's deposit history. Silent
# double-counting or orphaned rows after a reorg would show users incorrect balances.
# The migration idempotency test exists because migrations run once on deploy and any
# non-idempotent migration will crash a rollback or a fresh staging environment.
#
# WHY THE JOB SPLITS INTO fast AND devnet
# Reorg handling requires a real Geth+Lighthouse chain with genuine fork-choice events —
# Anvil produces instant finality and cannot produce reorgs. The fast job covers
# everything that can be tested with a Postgres testcontainer alone (no Docker Compose
# stack needed), which cuts its wall time to ~5 min. The devnet job runs in parallel
# because it uses an entirely different environment with no shared state.
#
# WHY cargo test --no-run RUNS BEFORE THE INDIVIDUAL TEST STEPS
# Compiling test binaries is the most expensive part of the fast job. Running it once
# upfront means all three subsequent test steps use the cached binary. Without this,
# each cargo test --test ... command recompiles from scratch, tripling build time.
#
# GOTCHAS
# - The Postgres testcontainer is started by the test code itself, not by the CI job.
#   If Docker is not available on the runner, the migrations test will fail with a
#   confusing "connection refused" error, not a "Docker not found" error. The fast job
#   deliberately omits a Docker availability check because it should not need compose;
#   if you start seeing connection refused in migrations, verify the runner has Docker.
# - fork_indexer requires Geth to produce at least two competing chain tips, which
#   takes several seconds after boot. The test polls with a timeout; if Lighthouse is
#   slow to start, the test may time out before a reorg occurs. If this flakes, check
#   the Lighthouse boot logs first before suspecting the indexer logic.

name: explorer-indexer-migrations-reorg

# CI taxonomy (issue #1105): every job here exercises integration/devnet/
# testcontainer behaviour (migrations against a real Postgres, reorg handling on a
# real Geth devnet, IC committee/regime endpoints against a Postgres testcontainer)
# — that is the `system-correctness` class. system-correctness skips drafts and runs
# from ready_for_review onward, and is bypassed on docs-only changes.
env:
  CI_CLASS: system-correctness

on:
  # system-correctness: defer until the PR is ready for review (no draft runs),
  # plus push to dev/dev-phase-* for merged-commit coverage. paths-ignore bypasses
  # docs-only PRs (no behavioural code to exercise).
  push:
    branches: [dev, "dev-phase-*"]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: explorer-indexer-fast
    runs-on: ubuntu-latest
    # system-correctness: never run on a draft PR (push/dispatch events have no PR).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 35 (was 25): issue #1282 added eight previously dark targets (37 tests,
    # ~2m10s locally). Each boots its own Postgres testcontainer, which is
    # slower on a GitHub-hosted runner than on a developer machine.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build test binaries
        working-directory: services/explorer-indexer
        run: cargo test --no-run

      - name: ABI drift gate
        working-directory: services/explorer-indexer
        run: cargo test --lib -- abi::tests::abi_drift_gate --nocapture

      # LIB UNIT TESTS (issue #1434)
      #
      # Before this step, CI executed exactly TWO of this crate's 21 `--lib`
      # tests, each named individually: `abi::tests::abi_drift_gate` above, and
      # `abi::tests::event_topics_match_foundry_artifacts` in
      # suite-16-abi-drift.yml. The other 19 were compiled by `cargo test
      # --no-run` and run by nothing — `feature_flags::tests` (9),
      # `db::count_guard_tests` (2), two further `abi::tests`, and the
      # `indexer::risk_label_tests` added by issue #1434.
      #
      # check_cargo_test_target_coverage.py (suite-04) closes this hole for
      # integration targets — a `tests/<name>.rs` no workflow invokes — but its
      # subject is (package, target) pairs, so a `--lib` target that IS invoked
      # under a name filter counts as covered while every unnamed test in it
      # stays dark. This step is the lib-side counterpart: it runs the whole lib
      # target so adding a `#[cfg(test)] mod` to src/ no longer adds zero CI
      # coverage.
      #
      # --skip event_topics_match_foundry_artifacts because that test reads the
      # compiled Foundry artifacts in out/, which this job deliberately does not
      # build; suite-16 owns it and runs it there after `forge build`. Skipping
      # it here is not a silent skip: it asserts loudly when out/ is absent
      # (issue #1346), which is exactly why it cannot run in this job.
      #
      # Routed through cargo_test_require_executed.sh so a filter that stops
      # matching — a renamed module, a moved test — fails RED instead of passing
      # as a zero-collected run.
      #
      # Invariant (B) of check_rust_test_target_compile_coverage.py holds: this
      # job compiles this crate's tests/ binaries in `Build test binaries` above,
      # in the same job, so the crate-local verdict is honest.
      - name: Lib unit tests
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p explorer-indexer --lib \
            -- --skip event_topics_match_foundry_artifacts --nocapture

      # MIGRATIONS + BOOT SCHEMA GUARD (issues #1359, #1392)
      # tests/migrations.rs covers the schema itself, the `--migrate-only` CLI,
      # and (issue #1392) the boot-time refusal to run against a schema whose
      # applied version differs from the one embedded in the binary.
      #
      # Routed through cargo_test_require_executed.sh so a run that collects
      # zero tests fails RED instead of passing as a silent skip — a plain
      # `cargo test` exits 0 when nothing ran. EXPLORER_INDEXER_REQUIRE_PG turns
      # a missing Postgres testcontainer into a panic rather than an early
      # return, which the executed-count guard cannot see on its own (a test
      # that returns early still reports as passed). `CI` alone already implies
      # this, but naming it here keeps the requirement explicit and survives a
      # local `act` run. Loud-skip, never silent-skip.
      - name: Migrations, migrate-only CLI, and boot schema-version guard
        env:
          EXPLORER_INDEXER_REQUIRE_PG: "1"
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p explorer-indexer \
            --test migrations -- --test-threads=1 --nocapture

      - name: Block ingestion idempotency
        working-directory: services/explorer-indexer
        run: cargo test --test idempotency -- --nocapture

      - name: RPC failure recovery
        working-directory: services/explorer-indexer
        run: cargo test --test rpc_failure -- --nocapture

      # CONSENSUS RECOMMENDATION RECEIPT INDEXING (issue #1247, docs/architecture.md §4.9)
      # A `tests/<name>.rs` file is executed by NOTHING unless a job names it with an
      # explicit `--test <name>`. This step wires the receipt-event ingestion tests
      # (ReceiptRecorded / ReceiptReleased, payload-digest verification, and the
      # reorg rewrite of `consensus_receipts` via `delete_above_block`) into CI.
      # Routed through cargo_test_require_executed.sh so a run that collects zero
      # tests fails RED instead of passing as a silent skip.
      - name: Consensus receipt indexing + reorg rewrite
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p explorer-indexer \
            --test consensus_receipt_indexing -- --nocapture

      # REORG ROLLBACK COVERAGE (issue #1283)
      # These two test files existed and were executed by NOTHING — the steps
      # above name migrations / idempotency / rpc_failure / consensus_receipt
      # only, and cargo runs a `tests/<name>.rs` file solely when a job names it.
      # They are the suites that would have caught the shipped defect: the reorg
      # rollback iterated a hand-written table list, migration 0014 added
      # committee_votes and regime_snapshots without editing it, and a reorg left
      # both tables serving orphaned rows. reorg_cursor_vault_status now also
      # asserts the rollback set is DERIVED from the live schema, so the next
      # block-scoped table is covered by the migration that creates it.
      #
      # EXPLORER_INDEXER_REQUIRE_PG turns a missing Postgres testcontainer into a
      # panic instead of an early return. The executed-count guard below cannot
      # see that difference on its own: a test that returns early still reports
      # as passed, so without this the whole step could be a green zero-assertion
      # run. Loud-skip, never silent-skip.
      # THE EIGHT INDEXER TARGETS NOTHING EXECUTED (issue #1282)
      # The four steps above are the only indexer targets any workflow named, so
      # eight of the thirteen tests/*.rs files in this crate never ran anywhere.
      # Two of them are the repository's ONLY reorg-correctness suites:
      # cursor_header_reorg.rs (header-cursor persistence, walk-back root
      # rejection, stale-row deletion below a no-event cursor) and
      # reorg_cursor_vault_status.rs (cursor + vault-status rollback). Issue
      # #1283 -- reorg recovery in src/db.rs omitting two block-scoped tables
      # added by migration 0014 -- shipped precisely because these two were dark.
      # The other six cover the read path the dApp renders: account history,
      # position vote power, committee indexing, multi-vault, vault detail and
      # the vault registry.
      #
      # All eight use the same Postgres testcontainer harness as the steps above
      # (tests/common/mod.rs::try_pg_fixture), so they need Docker and nothing
      # else -- no compose stack, no devnet. Measured cost: 37 tests, ~2m10s
      # wall clock locally.
      #
      # Wrapped in the executed-count guard so a run that collects zero tests
      # fails RED instead of passing as a silent skip.
      - name: Indexer reorg + read-path suites
        env:
          EXPLORER_INDEXER_REQUIRE_PG: "1"
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p explorer-indexer \
            --test cursor_header_reorg \
            --test reorg_cursor_vault_status \
            --test account_history \
            --test account_position_vote_power \
            --test committee_indexing \
            --test multi_vault \
            --test vault_detail \
            --test vault_registry -- --test-threads=1 --nocapture

  # EXPLORER-API IC COMMITTEE / REGIME / CONSENSUS-RECEIPT ENDPOINT TESTS (issues #1105, #1247)
  # The clients/explorer-api crate (the read API the dApp queries) shipped IC committee
  # and regime-feed endpoint integration tests (committee_api.rs, regime_api.rs from
  # PR #1083) that NO required suite executed — the fast job above runs only
  # services/explorer-indexer, a different crate. That left the IC endpoint handlers with
  # zero executed-in-CI coverage (a silent-skip false green). This job runs them so a
  # regression in any committee/regime endpoint handler turns CI RED.
  #
  # Like the fast job, these tests start a Postgres TESTCONTAINER from inside the test code
  # (not a CI service), so the runner only needs Docker. We verify Docker up front: if it
  # is absent the testcontainer cannot start and the tests would otherwise fail with a
  # confusing "connection refused" — the explicit check fails LOUDLY with a clear message
  # (loud-skip, never silent-skip). The cargo_test_require_executed.sh wrapper additionally
  # fails RED if zero tests were collected, so "no tests ran" can never be a green pass.
  explorer-api:
    name: explorer-api-committee-regime
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # 40 (was 25): issue #1282 added four previously dark targets (49 tests,
    # ~2m40s locally). endpoints.rs dominates -- it starts a seeded Postgres
    # testcontainer per test, 42 times, and container start is the slow part on
    # a GitHub-hosted runner.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Docker is available (testcontainer Postgres resource)
        run: |
          # The committee_api / regime_api / consensus_receipt_api tests start a Postgres
          # testcontainer in-process.
          # Fail loudly here if Docker is missing instead of letting the tests skip/no-op.
          docker version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: explorer-api committee + regime + consensus-receipt endpoint tests
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p explorer-api \
            --test committee_api \
            --test regime_api \
            --test consensus_receipt_api -- --nocapture

      # THE FOUR SIBLING EXPLORER-API SUITES LEFT DARK (issue #1282)
      # The comment above this job records the team finding committee_api.rs and
      # regime_api.rs executed by nothing and wiring them up. The four other
      # tests/*.rs files sitting in the same directory were left exactly as they
      # were found -- still executed by nothing. endpoints.rs is the largest test
      # file in the crate (1090 lines, 42 tests) and is the ONLY executor of the
      # HTTP contract the dApp reads: health cursor, contract listing freshness
      # headers, JSON shape against the frozen snapshot fixtures, and the
      # negative assertion that sign/authorize-style URLs 404.
      # router_introspection.rs is the guard for §11 "the API does not sign,
      # authorize, or write" -- it walks src/routes.rs and fails on any non-GET
      # route. cors.rs pins the allowed-origin and GET-only preflight behaviour;
      # canonical_schema.rs pins byte-parity between this crate's embedded
      # migration and the indexer's canonical file.
      #
      # Same Postgres testcontainer requirement as the step above (the Docker
      # check at the top of this job covers both); router_introspection needs no
      # resource at all. Measured cost: 49 tests, ~2m40s wall clock locally,
      # dominated by endpoints.rs booting a seeded container per test.
      - name: explorer-api HTTP contract, CORS, router shape, schema parity
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            -p explorer-api \
            --test endpoints \
            --test router_introspection \
            --test cors \
            --test canonical_schema -- --test-threads=1 --nocapture

  devnet:
    name: explorer-indexer-devnet
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Boot Geth+Lighthouse devnet (with genesis alloc overlay)
        working-directory: testing/ethereum-testnet/config
        env:
          SMOKE_GENESIS_ALLOC_FILE: ${{ github.workspace }}/testing/fixtures/fork-state/genesis-alloc.json
        run: |
          BOOT_START=$(date +%s)
          docker compose -f docker-compose.yaml -f docker-compose.alloc.yaml up -d
          echo "Waiting for Geth RPC to be ready..."
          until curl -sf -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            http://localhost:8545 2>/dev/null | grep -q '"result"'; do
            sleep 2
          done
          BOOT_END=$(date +%s)
          BOOT_SECS=$((BOOT_END - BOOT_START))
          echo "devnet-boot-seconds=${BOOT_SECS}" >> "$GITHUB_STEP_SUMMARY" || true
          echo "Devnet ready in ${BOOT_SECS}s"
          if [ "${BOOT_SECS}" -gt 90 ]; then
            echo "ERROR: devnet boot took ${BOOT_SECS}s > 90s limit (AC #6: median target 60s)" >&2
            exit 1
          fi

      - name: Fork indexer test (against shared devnet)
        working-directory: services/explorer-indexer
        env:
          RMPC_TESTNET_RPC_URL: http://localhost:8545
        run: cargo test --test fork_indexer -- --nocapture

      - name: Devnet teardown (always)
        if: always()
        working-directory: testing/ethereum-testnet/config
        run: docker compose down -v --remove-orphans || true
