# Full-stack dapp overlay for the Robot Money devnet.
#
# Canonical: Plan tracking issue #109 §10.5 — Phase 4.5.
# Used by: testing/smoke-test (--full-stack flag, issue #228).
#
# Brings up Postgres, explorer-indexer, explorer-api, and the dapp
# against an already-running Geth+Lighthouse chain. The smoke-test
# binary starts the chain via docker-compose.yaml first, deploys
# contracts, then starts this stack passing deployed addresses as
# build args.
#
# Standalone usage (without the smoke-test binary):
#
#   # Required env vars:
#   #   VITE_GATEWAY_ADDRESS  — deployed gateway contract address
#   #   VITE_VAULT_ADDRESS    — deployed vault contract address
#   #   INDEXER_GATEWAY       — same as VITE_GATEWAY_ADDRESS
#   #   INDEXER_VAULT         — same as VITE_VAULT_ADDRESS
#   #
#   # Optional (defaults shown):
#   #   VITE_EXPLORER_API_URL=http://localhost:8080
#   #   INDEXER_RPC_URL=http://host.docker.internal:8545
#   #   INDEXER_CHAIN_ID=918453
#   #   INDEXER_CHAIN_NAME=devnet
#   #   EXPLORER_API_CHAIN_ID=918453
#   #   INDEXER_REGISTRY=          — VaultRegistry address (enables /v1/vaults)
#   #   INDEXER_PORTFOLIO_ROUTER=  — PortfolioRouter address (enables /v1/router/weights)
#   #   INDEXER_CONSENSUS_RECEIPT= — ConsensusRebalanceReceipt address (enables /v1/consensus-receipts)
#   #   VITE_VAULT_ADDRESSES=      — JSON {rmUSDC,rmPROTO,rmAGENT,rmRWA} map (enables applied/not-applied)
#   #   RECEIPT_FIXTURES_PORT=8097
#   #   POSTGRES_PORT=5432
#   #   EXPLORER_API_PORT=8080
#   #   DAPP_PORT=5173
#   #   POSTGRES_USER=robotmoney
#   #   POSTGRES_PASSWORD=robotmoney
#   #   POSTGRES_DB=explorer
#
#   cd testing/ethereum-testnet/config
#   docker compose -f docker-compose.dapp.yaml up

name: robotmoney-dapp

# Run-identity labels (testnet boot hardening) — see docker-compose.yaml for the
# rationale. The harness injects SMOKE_RUN_ID / SMOKE_RUN_CREATED so a later boot
# can reap dapp containers stranded by a previous run instead of colliding on the
# fixed container names. Defaults keep standalone `docker compose` usage working.
x-testnet-labels: &testnet-labels
  com.robotmoney.testnet: "1"
  com.robotmoney.testnet.run-id: "${SMOKE_RUN_ID:-standalone}"
  com.robotmoney.testnet.created: "${SMOKE_RUN_CREATED:-0}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dapp-postgres
    labels: *testnet-labels
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robotmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robotmoney}
      POSTGRES_DB: ${POSTGRES_DB:-explorer}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robotmoney} -d ${POSTGRES_DB:-explorer}"]
      # 2s cadence so indexer + explorer-api (depends_on postgres: service_healthy)
      # start promptly once Postgres accepts connections.
      interval: 2s
      timeout: 5s
      retries: 15

  # Issue #1354: indexer and explorer-api ship as SEPARATE images so either can
  # be restarted or redeployed without touching the other's process. They are
  # two named targets of one multi-stage build (docker/rust-services.Dockerfile),
  # not two Dockerfiles: both targets consume the same `builder` stage from the
  # same build context, so BuildKit compiles the shared workspace closure once
  # and serves the second target's builder layers from cache. Each image bakes
  # its own ENTRYPOINT — no `entrypoint:` override here selecting a binary out
  # of a shared image.
  explorer-indexer:
    image: robotmoney-explorer-indexer:devnet
    build:
      context: ../../..
      dockerfile: docker/rust-services.Dockerfile
      target: indexer
    container_name: dapp-explorer-indexer
    labels: *testnet-labels
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Issue #1294: the indexer verifies each receipt's payload_uri digest on
      # its FIRST scan of the ReceiptRecorded events (which are already on
      # chain before this compose stack boots). A fetch failure at that moment
      # is stored with verified=false and never re-verified, so the receipt-
      # fixtures server MUST be accepting connections before the indexer's first
      # tick. depends_on service_healthy turns that ordering requirement into a
      # hard gate instead of a race.
      receipt-fixtures:
        condition: service_healthy
    # Issue #775: join the ethereum-testnet_default network so the indexer
    # can reach Geth directly via the `geth` service hostname (port 8545
    # inside the chain network) instead of relying on host.docker.internal,
    # which is not reachable on all Docker host configurations.
    networks:
      - default
      - chain-net
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-robotmoney}:${POSTGRES_PASSWORD:-robotmoney}@postgres:5432/${POSTGRES_DB:-explorer}
      INDEXER_RPC_URL: ${INDEXER_RPC_URL:-http://geth:8545}
      INDEXER_CHAIN_ID: ${INDEXER_CHAIN_ID:-918453}
      INDEXER_CHAIN_NAME: ${INDEXER_CHAIN_NAME:-devnet}
      INDEXER_RPC_LABEL: ${INDEXER_CHAIN_NAME:-devnet}
      INDEXER_GATEWAY: ${INDEXER_GATEWAY:?INDEXER_GATEWAY must be set}
      INDEXER_VAULT: ${INDEXER_VAULT:?INDEXER_VAULT must be set}
      INDEXER_REGISTRY: ${INDEXER_REGISTRY:-}
      # Issue #1294: INDEXER_CONSENSUS_RECEIPT enables ReceiptRecorded /
      # ReceiptReleased event ingestion from ConsensusRebalanceReceipt, digest
      # verification against payload_uri, and writes to consensus_receipts
      # (issue #1247, docs/architecture.md §4.9). Without this the
      # /v1/consensus-receipts explorer endpoint returns an empty list even
      # when receipts were recorded on chain.
      INDEXER_CONSENSUS_RECEIPT: ${INDEXER_CONSENSUS_RECEIPT:-}
      # Issue #615: INDEXER_PORTFOLIO_ROUTER enables WeightsSet / DefaultWeightsSet
      # and RouterDeposit event ingestion from the PortfolioRouter contract.  Without
      # this the explorer /v1/router/weights endpoint returns an empty weight list
      # even when the deploy script called setWeights() before the dapp stack booted.
      INDEXER_PORTFOLIO_ROUTER: ${INDEXER_PORTFOLIO_ROUTER:-}
      # Bit 2 (INDEXER_MULTI_VAULT_EVENTS) enables VaultRegistered /
      # VaultStatusChanged event ingestion from the VaultRegistry.  Without
      # this flag the /v1/vaults explorer endpoint returns an empty list even
      # when INDEXER_REGISTRY is set.  Default to 4 (bit 2 only) so devnet
      # smoke-test runs that do not explicitly set FEATURE_FLAGS still index
      # vault-registry events and suite-10 dapp-e2e tests can see vault rows.
      # config/feature-flags.json id=2; services/explorer-indexer/src/feature_flags.rs.
      FEATURE_FLAGS: ${FEATURE_FLAGS:-4}

  # Issue #1354: builds its OWN image from the `explorer-api` target of the
  # shared multi-stage build (see explorer-indexer above). The `builder` stage
  # is identical for both targets, so this build is a cache hit on the cargo
  # compile rather than a second one.
  explorer-api:
    image: robotmoney-explorer-api:devnet
    build:
      context: ../../..
      dockerfile: docker/rust-services.Dockerfile
      target: explorer-api
    container_name: dapp-explorer-api
    labels: *testnet-labels
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Ordering preserved across the issue #1354 image split. The reason is
      # schema, not packaging: the indexer owns `db.migrate()`
      # (services/explorer-indexer/src/main.rs) and explorer-api runs no
      # migrations of its own, so the API must not start before the migrating
      # process has. (It used to ALSO serialise the shared image build; that
      # half of the rationale is gone now that each service builds its own
      # target, but the migration ordering still stands.)
      explorer-indexer:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-robotmoney}:${POSTGRES_PASSWORD:-robotmoney}@postgres:5432/${POSTGRES_DB:-explorer}
      EXPLORER_API_CHAIN_ID: ${EXPLORER_API_CHAIN_ID:-918453}
      EXPLORER_API_BIND: 0.0.0.0:8080
      EXPLORER_API_ALLOW_ORIGINS: ${VITE_DAPP_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:${EXPLORER_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      # 2s cadence so dapp (depends_on explorer-api: service_healthy) starts
      # promptly once the API answers /health.
      interval: 2s
      timeout: 5s
      retries: 30

  dapp:
    build:
      context: ../../..
      dockerfile: clients/dapp/Dockerfile
      args:
        VITE_EXPLORER_API_URL: ${VITE_EXPLORER_API_URL:-http://localhost:8080}
        VITE_DEVNET_RPC_URL: ${VITE_DEVNET_RPC_URL:-}
        VITE_GATEWAY_ADDRESS: ${VITE_GATEWAY_ADDRESS:?VITE_GATEWAY_ADDRESS must be set}
        VITE_VAULT_ADDRESS: ${VITE_VAULT_ADDRESS:?VITE_VAULT_ADDRESS must be set}
        VITE_GATEWAY_EXPECTED_CODE_HASH: ${VITE_GATEWAY_EXPECTED_CODE_HASH:?VITE_GATEWAY_EXPECTED_CODE_HASH must be set to enable admin writes}
        VITE_GATEWAY_CODE_HASH_VERIFIED: "false"
        VITE_ENV_CLASS: fork
        VITE_BROWSER_KEYGEN: "false"
        VITE_HISTORY_PANE: "true"
        # Issue #261: bake the smoke-test USDC holder key into the dapp
        # bundle so the Faucet tab and onboarding seed can drip canonical
        # USDC. Defaults to empty if the parent process did not set it
        # (e.g. ad-hoc local builds without the harness running); the
        # FaucetTab and seed handler fail closed in that case.
        VITE_FAUCET_HARNESS_PRIVATE_KEY: ${VITE_FAUCET_HARNESS_PRIVATE_KEY:-}
        # Issue #320: VaultRegistry and PortfolioRouter addresses for
        # the DestinationSelector. Default to zero address so the
        # router deposit path is hidden in standalone builds without
        # the smoke-test harness.
        VITE_REGISTRY_ADDRESS: ${VITE_REGISTRY_ADDRESS:-0x0000000000000000000000000000000000000000}
        VITE_ROUTER_ADDRESS: ${VITE_ROUTER_ADDRESS:-0x0000000000000000000000000000000000000000}
        # Issue #364: RouterGovernance address for the Governance tab.
        # Default to zero address so the governance panel shows the
        # config-missing placeholder in standalone builds.
        VITE_GOVERNANCE_ADDRESS: ${VITE_GOVERNANCE_ADDRESS:-0x0000000000000000000000000000000000000000}
        # Issue #365: RM token address for the Faucet tab 'Get RM tokens' button.
        # Default to zero address so the RM drip button is hidden in standalone
        # builds without the smoke-test harness deploying the governance+RM stack.
        VITE_RM_TOKEN_ADDRESS: ${VITE_RM_TOKEN_ADDRESS:-0x0000000000000000000000000000000000000000}
        # Issue #1294: bucket->vault-symbol->address JSON map (rmUSDC, rmPROTO,
        # rmAGENT, rmRWA — tests/fixtures/consensus-receipt.bucket-vault-map.json)
        # so ConsensusReceiptPanel can compute the applied/not-applied state
        # against live router weights. Single-quoted: the value is a raw JSON
        # object and must not be re-parsed as a YAML mapping by compose's
        # variable substitution. Defaults to empty so standalone builds without
        # the smoke-test harness degrade to "cannot determine" rather than
        # guessing (see consensusReceiptApi.ts parseVaultAddressMap).
        VITE_VAULT_ADDRESSES: '${VITE_VAULT_ADDRESSES:-}'
        # Issue #466: native Base ETH gas drip amount documented for parity
        # with FAUCET_DRIP_AMOUNT_ETH in clients/dapp/src/lib/chainClassifier.ts.
        # Surfaced through compose so docs/environments.md and the env-doc
        # integrity check stay consistent.
        VITE_FAUCET_DRIP_ETH_WEI: ${VITE_FAUCET_DRIP_ETH_WEI:-10000000000000000}
    container_name: dapp-frontend
    labels: *testnet-labels
    restart: unless-stopped
    depends_on:
      explorer-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DAPP_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:5173'); process.exit(r.ok ? 0 : 1)\""]
      interval: 2s
      timeout: 5s
      retries: 30

  # Issue #1294: serves the two consensus-receipt payload fixtures at the SAME
  # literal URL for both consumers of an on-chain `payload_uri`:
  #   - explorer-indexer (digest verification) reaches this container by its
  #     Docker service name over the shared `default` compose network — the
  #     same mechanism explorer-indexer already uses to reach `geth` and
  #     `postgres`.
  #   - the Playwright browser reaches the SAME hostname via a
  #     `--host-resolver-rules` mapping straight to 127.0.0.1
  #     (clients/dapp/playwright.config.ts), which lands on this service's
  #     published host port below.
  # Static, non-secret test fixtures only — no dynamic content, no request
  # handling beyond serving files from disk.
  receipt-fixtures:
    image: python:3-alpine
    container_name: dapp-receipt-fixtures
    labels: *testnet-labels
    restart: unless-stopped
    working_dir: /fixtures
    environment:
      RECEIPT_FIXTURES_PORT: ${RECEIPT_FIXTURES_PORT:-8097}
    volumes:
      - ./consensus-receipt-fixtures:/fixtures:ro
    command: ["python3", "/fixtures/server.py"]
    ports:
      - "127.0.0.1:${RECEIPT_FIXTURES_PORT:-8097}:${RECEIPT_FIXTURES_PORT:-8097}"
    healthcheck:
      # python:3-alpine ships python3 but no guaranteed curl/wget; open a TCP
      # socket to the http.server's port via os.environ (no shell expansion
      # needed, so no quoting hazards). Gates the explorer-indexer's first
      # scan, which must find the payload the moment it ingests ReceiptRecorded
      # (verified=false is stored once and never re-verified).
      test: ["CMD-SHELL", "python3 -c 'import os,socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\", int(os.environ[\"RECEIPT_FIXTURES_PORT\"]))); s.close()'"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

# Issue #775: chain-net joins the ethereum-testnet_default Docker network
# created by docker-compose.yaml (the chain compose stack) so that
# explorer-indexer can reach Geth via the `geth` service name rather than
# host.docker.internal.  The ethereum-testnet stack must be running before
# this overlay is brought up (the README and standalone usage instructions
# already require this).
networks:
  chain-net:
    external: true
    name: ethereum-testnet_default
